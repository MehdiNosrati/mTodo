name: mTodo
options:
  bundleIdPrefix: dev.mahdins
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
    FRAMEWORK_SEARCH_PATHS:
      - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
      - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
      - "$(BUILT_PRODUCTS_DIR)"

targets:
  mTodo:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/mTodoShared.framework
        embed: false
      - target: TodoWidget
    preBuildScripts:
      - name: Compile and Embed KMP Framework
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mahdins.mtodo
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TodoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mahdins.mtodo.TodoWidget
        INFOPLIST_FILE: TodoWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
